{% extends "base.html" %}

{% block content %}
<h3>Добавление</h3>
<form action="/product/add" method="post">
    <div class="d-flex gap-3 align-items-center">
        <h3 class="mr-3" for="text">Название: </h3>
        <p class="m-0"><input type="text" id="text" name="name"></p>
    </div>

    <div class="d-flex gap-3 align-items-center">
        <h3 class="mr-3" for="text">Цена: </h3>
        <p class="m-0"><input type="text" id="text" name="price"></p>
    </div>

    <div class="d-flex gap-3 align-items-center">
        <h3 class="mr-3" for="text">Количество: </h3>
        <p class="m-0"><input type="text" id="text" name="cnt"></p>
    </div>

    <div class="d-flex gap-3 align-items-center">
        <h3 class="mr-3" for="text">Описание: </h3>
        <p class="m-0"><input type="text" id="text" name="description"></p>
    </div>

    <div class="d-flex gap-3 align-items-center">
        <h3 class="mr-3" for="text">Категория: </h3>
        <select name="category_id" class="form-select" aria-label="Default select example">
            <option selected>Выбрать категорию</option>
            {% for i in cats %}
            <option value={{i.id}}>{{i.name}}</option>
            {% endfor %}
        </select>
    </div>

    <button text="Отправить" type="submit" type="button" class="btn btn-success mt-2" value="Submit">Добавить</button>
</form>
{% endblock %}
